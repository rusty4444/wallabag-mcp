[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallabag-mcp"
version = "0.2.0"
description = "Model Context Protocol server for wallabag read-it-later instances"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hermes Agent" }]
keywords = ["wallabag", "mcp", "model-context-protocol", "read-it-later", "bookmarks"]
dependencies = [
  "mcp>=2.1.0",
  "httpx>=0.28.0",
  "pydantic>=2.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.0",
  "pytest-cov>=7.1.0",
  "respx>=0.23.0",
  "ruff==0.16.5",
]

[project.scripts]
wallabag-mcp = "wallabag_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wallabag_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
